<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 권의 기록 — 인덕대학교 총학생회 언론부</title>
<meta name="description" content="인덕대학교 총학생회 언론부 연말 잡지 제작 3D 프레젠테이션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700;900&family=Noto+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --ink:#16110C; --brown:#2A1D14; --ivory:#F3EDE0; --cream:#E6DAC3;
  --gold:#B8925A; --burgundy:#6E2230; --dim:rgba(243,237,224,.55);
  --serif:"Noto Serif KR",serif; --sans:"Noto Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#120D09;color:var(--ivory);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
#webgl{position:fixed;inset:0;z-index:0;display:block}
#css3d{position:fixed;inset:0;z-index:1;pointer-events:none}
.veil{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 52%,rgba(10,6,3,.62) 100%)}
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(-1%,-1%)}100%{transform:translate(0,0)}}

/* ---------- 지면 위 타이포그래피 (CSS3D: 실제 HTML 텍스트가 3D 종이 위에 놓임) ---------- */
.sheet-type{transition:opacity .8s ease;width:840px;height:594px;padding:62px 74px 54px;color:var(--ink);display:flex;flex-direction:column;font-family:var(--serif)}
.sheet-type .kick{display:flex;justify-content:space-between;align-items:baseline;font:500 15px/1 var(--mono);letter-spacing:.18em;color:#5B4632;border-bottom:1.5px solid #2B2017;padding-bottom:12px}
.sheet-type .kick b{font:600 15px/1 var(--serif);letter-spacing:.32em;color:var(--ink)}
.sheet-type h1{margin:58px 0 0;font:900 64px/1.26 var(--serif);letter-spacing:-.025em}
.sheet-type h1 span{display:block;clip-path:inset(0 100% 0 0)}
.sheet-type .rule{height:2px;width:0;background:var(--burgundy);margin:34px 0 26px}
.sheet-type .sub{margin:0;font:400 19px/1.75 var(--serif);color:#3A2C20;opacity:0}
.sheet-type .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;opacity:0}
.sheet-type .foot strong{font:700 23px/1 var(--serif);letter-spacing:.06em}
.sheet-type .foot .seal{display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--burgundy);border-radius:50%;font:700 22px/1 var(--serif);font-style:normal;color:var(--burgundy);transform:rotate(-8deg);opacity:.85}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:10;pointer-events:none;font-family:var(--sans)}
.hud-top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:30px 40px}
.brand{font:500 14px/1.4 var(--serif);letter-spacing:.24em;color:var(--ivory)}
.brand small{display:block;margin-top:6px;font:400 11px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}
.chapter{text-align:right;font:400 11px/1 var(--mono);letter-spacing:.22em;color:var(--dim)}
.chapter b{display:block;margin-top:8px;font:500 17px/1.2 var(--serif);letter-spacing:.04em;color:var(--ivory)}
.hud-bottom{left:40px;right:40px;bottom:28px;display:flex;align-items:center;gap:28px}
.segs{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.seg{pointer-events:auto;cursor:pointer;background:none;border:0;padding:10px 0 0;text-align:left;color:var(--dim);font:400 10px/1 var(--mono);letter-spacing:.18em;border-top:1px solid rgba(243,237,224,.18);position:relative;transition:color .4s}
.seg::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:var(--gold);transition:width .9s cubic-bezier(.7,0,.2,1)}
.seg.on{color:var(--ivory)} .seg.on::before{width:100%}
.seg span{display:block;margin-top:6px;font:400 12px/1.2 var(--serif);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:6px;pointer-events:auto}
.nav button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(243,237,224,.28);background:rgba(20,14,10,.35);color:var(--ivory);font:400 16px/1 var(--sans);cursor:pointer;backdrop-filter:blur(6px);transition:border-color .3s,background .3s}
.nav button:hover{border-color:var(--gold);background:rgba(184,146,90,.18)}
.nav button:disabled{opacity:.3;cursor:default}
.toast{position:fixed;z-index:12;left:50%;bottom:104px;transform:translate(-50%,10px);padding:12px 20px;font:400 13px/1.4 var(--sans);color:var(--ivory);background:rgba(22,15,10,.82);border:1px solid rgba(184,146,90,.4);opacity:0;transition:.5s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hud-in{opacity:0;transition:opacity 1.2s ease}
.hud-in.on{opacity:1}

/* ---------- 로딩 ---------- */
#loader{position:fixed;inset:0;z-index:50;background:#0E0A07;display:grid;place-items:center;transition:opacity 1.2s ease}
#loader .in{width:min(360px,70vw);text-align:center}
#loader p{margin:0 0 22px;font:500 15px/1.6 var(--serif);letter-spacing:.42em;color:var(--ivory)}
#loader small{display:block;margin-top:14px;font:400 11px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}
#loader .bar{height:1px;background:rgba(243,237,224,.14)} #loader .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
/* ---------- 장면별 본문 (HTML 텍스트 레이어) ---------- */
.scrim{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.1s ease}
.scrim.left{opacity:1;background:linear-gradient(90deg,rgba(14,9,6,.86) 0%,rgba(14,9,6,.62) 30%,rgba(14,9,6,0) 56%)}
.scrim.right{opacity:1;background:linear-gradient(270deg,rgba(14,9,6,.86) 0%,rgba(14,9,6,.62) 30%,rgba(14,9,6,0) 56%)}
.scrim.center{opacity:1;background:radial-gradient(70% 60% at 50% 55%,rgba(14,9,6,.15),rgba(14,9,6,.78))}
.copy{position:fixed;z-index:6;top:50%;transform:translateY(-50%);width:min(540px,38vw);pointer-events:none;color:var(--ivory)}
.copy.left{left:6.2vw} .copy.right{right:6.2vw} .copy.center{left:50%;transform:translate(-50%,-50%);width:min(860px,82vw);text-align:center}
.copy .rv{opacity:0;transform:translateY(22px);filter:blur(6px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1s}
.copy.in .rv{opacity:1;transform:none;filter:none}
.copy .kick{font:500 12px/1 var(--mono);letter-spacing:.26em;color:var(--gold);display:flex;align-items:center;gap:14px}
.copy .kick::after{content:"";height:1px;width:56px;background:currentColor;opacity:.6}
.copy.center .kick{justify-content:center} .copy.center .kick::after{display:none}
.copy h2{margin:22px 0 0;font:900 clamp(34px,3.5vw,60px)/1.22 var(--serif);letter-spacing:-.02em}
.copy p{margin:22px 0 0;font:400 clamp(16px,1.22vw,21px)/1.9 var(--serif);color:rgba(243,237,224,.86)}
.copy .note{margin-top:26px;font:400 12px/1.6 var(--sans);color:rgba(243,237,224,.5)}
.copy .hint{margin-top:18px;font:500 13px/1.4 var(--sans);letter-spacing:.02em;color:var(--gold)}
.copy ol{list-style:none;margin:30px 0 0;padding:0;border-top:1px solid rgba(243,237,224,.16)}
.copy li{display:grid;grid-template-columns:62px 1fr;align-items:baseline;padding:14px 0;border-bottom:1px solid rgba(243,237,224,.12);color:rgba(243,237,224,.42);transition:color .6s}
.copy li b{font:500 12px/1 var(--mono);letter-spacing:.16em;color:rgba(184,146,90,.55);transition:color .6s}
.copy li span{font:600 clamp(16px,1.3vw,22px)/1.4 var(--serif)}
.copy li em{grid-column:2;display:block;max-height:0;overflow:hidden;font:400 clamp(14px,1.05vw,18px)/1.8 var(--serif);font-style:normal;color:rgba(243,237,224,.8);transition:max-height .8s ease,margin .8s ease}
.copy li.on{color:var(--ivory)} .copy li.on b{color:var(--gold)} .copy li.on em{max-height:140px;margin-top:10px}
.copy .end-lines p{font:500 clamp(20px,1.9vw,32px)/1.75 var(--serif);color:var(--ivory)}
.copy .end-lines p + p{font-size:clamp(16px,1.3vw,22px);color:rgba(243,237,224,.78)}
.copy .name{margin-top:34px;display:inline-flex;flex-direction:column;align-items:center;gap:14px}
.copy .name i{display:block;height:1px;width:90px;background:var(--burgundy);filter:brightness(1.8)}
.copy .name strong{font:900 clamp(28px,2.8vw,48px)/1.2 var(--serif);letter-spacing:.06em}
.copy .name small{font:400 12px/1 var(--mono);letter-spacing:.3em;color:var(--gold)}
.copy.end{width:min(660px,46vw)} .copy.end .name{align-items:flex-start} .copy.end .name strong{font-size:clamp(26px,2.5vw,44px);white-space:nowrap}
/* 부원 소개 액자 (CSS3D: 실제 사진과 이름) */
.member-card{width:520px;height:747px;padding:34px 34px 0;background:#F1EADB;display:flex;flex-direction:column;opacity:0;transition:opacity 1s ease .3s;box-shadow:inset 0 0 0 1px rgba(60,40,20,.18),inset 0 18px 40px -20px rgba(60,40,20,.35)}
.member-card.on{opacity:1}
.member-card.on.dim{opacity:.42}
.member-card .ph{position:relative;flex:0 0 520px;overflow:hidden;background:#2A1F17;box-shadow:0 0 0 1px rgba(40,25,12,.35)}
.member-card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.12) contrast(1.03);opacity:0}
.member-card.has-photo .ph img{opacity:1}
.member-card.has-photo .ph-empty{display:none}
.member-card .ph-empty{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 40%,#5a4636,#231a13)}
.member-card .ph-empty i{position:absolute;left:50%;top:22%;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:rgba(243,237,224,.16)}
.member-card .ph-empty i::after{content:"";position:absolute;left:50%;top:175px;width:300px;height:200px;margin-left:-150px;border-radius:150px 150px 0 0;background:rgba(243,237,224,.16)}
.member-card .ph-empty span{position:absolute;bottom:26px;left:0;right:0;text-align:center;font:500 26px/1.4 var(--sans);color:rgba(243,237,224,.75)}
.member-card .ph-empty small{font:400 18px/1 var(--mono);color:rgba(243,237,224,.5)}
.member-card .nm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink)}
.member-card .nm b{font:600 34px/1 var(--mono);letter-spacing:.4em;color:#6E2230;padding-left:.4em}
.member-card .nm strong{font:900 60px/1 var(--serif);letter-spacing:.08em}
.member-card .nm em{font:500 24px/1.2 var(--sans);font-style:normal;color:#5B4632;letter-spacing:-.01em}
.copy .member{margin-top:28px;padding-top:20px;border-top:1px solid rgba(243,237,224,.16)}
.copy .member{transition:opacity .6s ease,background .3s ease;pointer-events:auto;cursor:pointer;margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}
.copy .member:hover{background:rgba(243,237,224,.06)}
.copy .member:hover strong{color:#fff}
.copy .members.focus .member{opacity:.3}
.copy .members.focus .member.on{opacity:1}
.copy .member b{font:500 12px/1 var(--mono);letter-spacing:.3em;color:var(--gold)}
.copy .member strong{display:block;margin-top:10px;font:900 clamp(26px,2.3vw,40px)/1.2 var(--serif)}
.copy .member i{display:block;margin-top:6px;font:500 clamp(13px,1vw,16px)/1.4 var(--sans);font-style:normal;color:rgba(243,237,224,.62)}
.copy .member p{margin-top:10px;font-size:clamp(15px,1.1vw,19px);line-height:1.8}
/* 원고지 위 손글씨 (CSS3D) */
.ms-type{position:relative;width:1024px;height:1448px;font-family:"Nanum Pen Script",cursive;color:#1F2638}
.ms-type .ch{position:absolute;display:grid;place-items:center;font-size:52px;line-height:1;opacity:0;transform:translateY(3px);transition:opacity .22s,transform .22s}
.ms-type .ch.on{opacity:.92;transform:none}
@media (max-width:760px){.copy{width:86vw}.copy.left,.copy.right{left:7vw;right:auto;top:auto;bottom:110px;transform:none}.scrim.left,.scrim.right{background:linear-gradient(0deg,rgba(14,9,6,.9),rgba(14,9,6,.2) 60%)}}
@media (max-width:760px){.hud-top{padding:20px}.hud-bottom{left:20px;right:20px}.seg span{display:none}.chapter b{font-size:14px}}
@media (prefers-reduced-motion:reduce){.grain{animation:none}}
</style>
</head>
<body>
<div id="loader"><div class="in"><p>한 해를 기록하다</p><div class="bar"><i id="ldbar"></i></div><small id="ldtxt">작업실의 불을 켜는 중</small></div></div>

<canvas id="webgl"></canvas>
<div id="css3d"></div>
<div class="veil"></div>
<div class="grain"></div>

<!-- 1페이지 지면: 3D 종이 위에 그대로 얹히는 실제 HTML 텍스트 -->
<template id="tpl-cover">
  <div class="sheet-type">
    <div class="kick"><b>언론부 연말호</b><span><span data-cfg="year">2026</span> · VOL.01</span></div>
    <h1><span>우리가 함께한 순간들,</span><span>한 권의 기록이 되다.</span></h1>
    <div class="rule"></div>
    <p class="sub">학교의 순간을 기록하고, 사진과 이야기로 엮어<br>하나의 잡지로 완성합니다.</p>
    <div class="foot"><strong>인덕대학교 총학생회 언론부</strong><i class="seal">言</i></div>
  </div>
</template>

<header class="hud hud-top hud-in" id="hudTop">
  <div class="brand">인덕대학교 총학생회 언론부<small>ANNUAL MAGAZINE · <span data-cfg="year">2026</span></small></div>
  <div class="chapter"><span id="chNo">PAGE 01 / 06</span><b id="chTitle">한 해를 기록하다</b></div>
</header>
<footer class="hud hud-bottom hud-in" id="hudBottom">
  <div class="segs" id="segs"></div>
  <div class="nav"><button id="prev" aria-label="이전 장면">←</button><button id="next" aria-label="다음 장면">→</button></div>
</footer>
<div class="scrim" id="scrim"></div>
<section class="copy" id="copy" aria-live="polite"></section>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // 파일을 더블클릭해서 열었을 때(file://)는 3D 모델·사진을 내장 자료에서 읽어 옵니다
  if (location.protocol === "file:") document.write('<script src="press3d/offline-assets.js"><\/script><script src="press3d/member-photos.js"><\/script>');
</script>
<script src="press3d/app.js"></script>
</body>
</html>
